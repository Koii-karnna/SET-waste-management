<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zero Waste Dashboard - SET PFM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="login-screen" class="login-screen" hidden>
      <div class="login-card">
        <div class="brand"><span class="dot"></span> Zero Waste Dashboard</div>
        <form id="login-form">
          <div class="field">
            <label for="login-email">อีเมล</label>
            <input type="email" id="login-email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="login-password">รหัสผ่าน</label>
            <input type="password" id="login-password" required autocomplete="current-password" />
          </div>
          <div class="login-error" id="login-error"></div>
          <button type="submit" class="primary">เข้าสู่ระบบ</button>
        </form>
      </div>
    </div>

    <div id="main-screen" hidden>
      <header class="app-header">
        <div class="brand"><span class="dot"></span> Zero Waste Dashboard <span class="muted" style="color:#c9c6c0">SET PFM</span></div>
        <div class="header-user">
          <span id="user-email"></span>
          <button id="logout-btn">ออกจากระบบ</button>
        </div>
      </header>

      <div id="app">
        <nav class="tabbar" id="tabbar">
          <button class="tab-btn active" data-tab="entry">กรอกข้อมูล</button>
          <button class="tab-btn" data-tab="viewExport">View / Export</button>
          <button class="tab-btn" data-tab="dashboard">Dashboard</button>
        </nav>
        <div id="view-root"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
