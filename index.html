<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zero Waste Dashboard - SET PFM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="login-screen" class="login-screen" hidden>
      <div class="login-card">
        <div class="brand-title"><span class="dot"></span> Zero Waste Dashboard</div>
        <form id="login-form">
          <div class="field">
            <label for="login-email">อีเมล</label>
            <input type="email" id="login-email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="login-password">รหัสผ่าน</label>
            <div class="pw-wrap">
              <input type="password" id="login-password" required autocomplete="current-password" />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="แสดงรหัสผ่าน">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 11-4.24-4.24"/></svg>
              </button>
            </div>
          </div>
          <div class="login-error" id="login-error"></div>
          <button type="submit" class="primary">เข้าสู่ระบบ</button>
        </form>
      </div>
    </div>

    <div id="main-screen" hidden>
      <header class="app-header">
        <div class="header-brand">
          <span class="dot"></span> Zero Waste Dashboard
          <span class="sub">SET PFM</span>
        </div>
        <div class="header-right">
          <span id="user-email"></span>
          <span id="role-badge" class="role-badge" hidden>ดูอย่างเดียว</span>
          <button id="logout-btn">ออกจากระบบ</button>
        </div>
      </header>

      <nav class="tabs-bar" id="tabbar">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="entry">กรอกข้อมูล</button>
        <button class="tab-btn" data-tab="incoming">ขาเข้า</button>
        <button class="tab-btn" data-tab="outgoing">ขาออก</button>
        <button class="tab-btn" data-tab="viewExport">View / Export</button>
      </nav>

      <div class="main-content" id="view-root"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
